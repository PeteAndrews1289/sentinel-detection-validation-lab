name: Offline validation-tool tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref verified during publication preparation
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 ref verified during publication preparation
        with:
          python-version: '3.12'
      - name: Run fixture-based tests (not live KQL or Azure)
        working-directory: lab
        run: python -m unittest discover -s tests -v
